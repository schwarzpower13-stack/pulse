<title>Pulse Life</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Figtree:wght@400..700&family=Noto+Sans+Georgian:wght@400..700&family=Noto+Serif+Georgian:wght@500..800&display=swap">
<style>
@property --m1 { syntax:"<color>"; inherits:true; initial-value:#8FB3FF; }
@property --m2 { syntax:"<color>"; inherits:true; initial-value:#FFB199; }
@property --m3 { syntax:"<color>"; inherits:true; initial-value:#C9A7FF; }
:root{
  color-scheme:dark;
  --m1:#8FB3FF; --m2:#FFB199; --m3:#C9A7FF;
  --bg:#0C0E17; --bg2:#141827; --card:rgba(255,255,255,.045); --card2:rgba(255,255,255,.075); --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.13);
  --text:#EEF0F8; --dim:#9CA3BD; --ink-on-m:#10131F; --aur:.5; --shadow:0 14px 40px rgba(0,0,0,.35);
  --good:#4FD1A5; --warn:#F2C14E; --bad:#FF7A6B;
  --ar-business:#7C8CFF; --ar-health:#4FD1A5; --ar-finance:#F2C14E; --ar-learning:#B28DFF; --ar-relationships:#FF8FB1; --ar-mind:#6FD6E0; --ar-home:#E0A36B; --ar-other:#9CA3BD;
  --f-display:"Bricolage Grotesque","Noto Serif Georgian",system-ui,sans-serif;
  --f-body:"Figtree","Noto Sans Georgian",system-ui,-apple-system,sans-serif;
  transition:--m1 1.6s ease, --m2 1.6s ease, --m3 1.6s ease;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){ color-scheme:light; --bg:#EEF1F8; --bg2:#FFFFFF; --card:rgba(255,255,255,.66); --card2:rgba(255,255,255,.9); --line:rgba(22,26,46,.08); --line2:rgba(22,26,46,.14); --text:#161A2B; --dim:#586079; --aur:.32; --shadow:0 12px 34px rgba(40,50,90,.12); }
}
:root[data-theme="light"]{ color-scheme:light; --bg:#EEF1F8; --bg2:#FFFFFF; --card:rgba(255,255,255,.66); --card2:rgba(255,255,255,.9); --line:rgba(22,26,46,.08); --line2:rgba(22,26,46,.14); --text:#161A2B; --dim:#586079; --aur:.32; --shadow:0 12px 34px rgba(40,50,90,.12); }
:root[data-theme="dark"]{ color-scheme:dark; --bg:#0C0E17; --bg2:#141827; --card:rgba(255,255,255,.045); --card2:rgba(255,255,255,.075); --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.13); --text:#EEF0F8; --dim:#9CA3BD; --aur:.5; --shadow:0 14px 40px rgba(0,0,0,.35); }

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.55 var(--f-body);padding-inline:16px;padding-block:0 calc(env(safe-area-inset-bottom,0px) + 110px);overflow-x:hidden;-webkit-font-smoothing:antialiased}
body.genesis-mode{padding-bottom:0}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--m1);outline-offset:3px;border-radius:10px}
.sr{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
h1,h2,h3{font-family:var(--f-display);font-weight:700;letter-spacing:-.015em;text-wrap:balance;margin:0}
p{margin:0}
.muted{color:var(--dim)} .small{font-size:13.5px} .center{text-align:center}
.eyebrow{font-size:11.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.row{display:flex;align-items:center} .gap{gap:8px} .wrap{flex-wrap:wrap} .between{justify-content:space-between}
.stack{display:grid;gap:14px} .stack.tight{gap:8px}

/* aurora */
#aurora{position:fixed;inset:-20vmax;z-index:-1;pointer-events:none;opacity:var(--aur);filter:blur(70px) saturate(1.15)}
#aurora i{position:absolute;border-radius:50%;display:block;width:60vmax;height:60vmax;animation:drift 28s ease-in-out infinite alternate}
#aurora .a1{background:radial-gradient(circle,var(--m1),transparent 62%);left:-5vmax;top:-12vmax}
#aurora .a2{background:radial-gradient(circle,var(--m2),transparent 62%);right:-15vmax;top:18vmax;animation-duration:34s;animation-delay:-8s}
#aurora .a3{background:radial-gradient(circle,var(--m3),transparent 62%);left:10vmax;bottom:-25vmax;animation-duration:40s;animation-delay:-16s}
@keyframes drift{0%{transform:translate(0,0) scale(1)}50%{transform:translate(6vmax,4vmax) scale(1.12)}100%{transform:translate(-5vmax,7vmax) scale(.95)}}

/* orb */
.orb{position:relative;border-radius:50%;flex:none;width:36px;height:36px;isolation:isolate}
.orb i{position:absolute;inset:0;border-radius:50%;mix-blend-mode:screen;animation:spin 14s linear infinite}
.orb i:nth-child(1){background:radial-gradient(circle at 30% 30%,var(--m1),transparent 62%)}
.orb i:nth-child(2){background:radial-gradient(circle at 70% 40%,var(--m2),transparent 60%);animation-duration:19s;animation-direction:reverse}
.orb i:nth-child(3){background:radial-gradient(circle at 45% 75%,var(--m3),transparent 60%);animation-duration:23s}
.orb span{position:absolute;inset:0;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(255,255,255,.28),0 0 28px -4px var(--m1);animation:breathe 5s ease-in-out infinite}
.orb.sm{width:30px;height:30px} .orb.md{width:64px;height:64px} .orb.lg{width:112px;height:112px} .orb.xl{width:170px;height:170px}
body.thinking .orb i{animation-duration:2.4s} body.thinking .orb span{animation-duration:1.2s}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes breathe{0%,100%{transform:scale(1);opacity:.9}50%{transform:scale(1.06);opacity:1}}

/* header */
#hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;display:flex;align-items:center;gap:10px;padding:12px 0 10px;margin:0 -16px 6px;padding-inline:16px;background:linear-gradient(var(--bg) 55%,transparent);max-width:none}
body.genesis-mode #hdr{display:none}
.hdr-orb{background:none;border:0;padding:0;cursor:pointer}
.hdr-t{flex:1;min-width:0}
.hdr-k{font-size:12px;color:var(--dim);text-transform:capitalize}
.hdr-n{font-family:var(--f-display);font-weight:700;font-size:18px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mood-pill{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line2);background:var(--card);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-radius:999px;padding:6px 12px 6px 8px;font-size:13px;cursor:pointer;white-space:nowrap}
.mdot{width:14px;height:14px;border-radius:50%;background:conic-gradient(from 200deg,var(--m1),var(--m2),var(--m3),var(--m1));display:inline-block}
.mdot.big{width:34px;height:34px}
.sync{width:8px;height:8px;border-radius:50%;background:var(--dim);flex:none}
.sync[data-state="synced"]{background:var(--good)} .sync[data-state="saving"]{background:var(--warn)} .sync[data-state="error"]{background:var(--bad)}

main{max-width:680px;margin:0 auto;padding-top:4px}
#hdr{max-width:680px;margin-left:auto;margin-right:auto}

/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px;backdrop-filter:blur(18px) saturate(1.2);-webkit-backdrop-filter:blur(18px) saturate(1.2);display:grid;gap:10px;align-content:start}
.card-k{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
.card-k .src{margin-left:auto}
.sec{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-top:10px}
.sec h2{font-size:19px}
.lead{font-size:17px;line-height:1.5}
.src{font-size:11px;letter-spacing:.08em;border:1px solid var(--line2);border-radius:999px;padding:2px 8px;text-transform:none;color:var(--dim)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line2);background:var(--card2);color:var(--text);border-radius:14px;padding:12px 16px;font-weight:600;font-size:15px;cursor:pointer;min-height:46px;transition:transform .15s,background .2s}
.btn:active{transform:scale(.97)}
.btn.primary{border:0;color:var(--ink-on-m);background:linear-gradient(120deg,var(--m1),var(--m2));box-shadow:0 8px 24px -10px var(--m1)}
.btn.ghost{background:transparent}
.btn.sm{min-height:38px;padding:8px 13px;font-size:14px;border-radius:12px}
.btn.big{min-height:56px;padding:14px 26px;font-size:17px;border-radius:18px}
.btn.danger,.link.danger{border-color:var(--bad);color:var(--bad)}
.btn:disabled{opacity:.45;cursor:default}
.link{background:none;border:0;padding:4px 0;color:var(--m1);font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:4px;justify-self:start}
.link:disabled{opacity:.4}
.icon-btn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line2);background:var(--card);display:grid;place-items:center;cursor:pointer;flex:none}
.icon-btn.sm{width:32px;height:32px;border-radius:10px;font-size:18px}
.icon-btn.flip svg{transform:scaleX(-1)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line2);background:var(--card);border-radius:999px;padding:8px 14px;cursor:pointer;min-height:38px;font-size:14px}
.chip[aria-pressed="true"]{background:linear-gradient(120deg,var(--m1),var(--m2));color:var(--ink-on-m);border-color:transparent;font-weight:700}
.field{width:100%;border:1px solid var(--line2);background:var(--card2);border-radius:14px;padding:12px 14px;font-size:16px;min-width:0;outline:none}
.field:focus{border-color:var(--m1)}
textarea.field{resize:vertical;line-height:1.5}
textarea.field.big{min-height:220px}
.q{font-weight:600;margin-top:4px}
.lab{display:grid;gap:4px} .lab small{color:var(--dim);font-size:12.5px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* rings, bars */
.ring{position:relative;flex:none} .ring-svg{width:100%;height:100%;display:block}
.ring-arc{transition:stroke-dashoffset 1s ease}
.ring-c{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring-c b{font-family:var(--f-display);font-size:26px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
.ring-c small{color:var(--dim);font-size:11.5px;margin-top:3px;max-width:130px}
.bar{height:6px;border-radius:99px;background:var(--line2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--area,var(--m1)),var(--m2))}
.pct{font-family:var(--f-display);font-variant-numeric:tabular-nums}

/* genesis */
.gen{max-width:680px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;gap:14px;padding-top:calc(env(safe-area-inset-top,0px) + 16px)}
.gen-brand{display:flex;gap:14px;align-items:center}
.gen-h{font-size:clamp(28px,7vw,40px);line-height:1.05}
.gen-map{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:14px}
.gm{display:grid;gap:4px;justify-items:center;text-align:center}
.gm i{width:100%;height:5px;border-radius:99px;background:linear-gradient(90deg,var(--m1) calc(var(--p)*1%),var(--line2) 0)}
.gm span{font-size:10.5px;color:var(--dim);line-height:1.2}
.gen-bar{position:relative;height:28px;border-radius:99px;background:var(--card);border:1px solid var(--line);overflow:hidden;margin-top:12px}
.gen-bar-f{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,var(--m1),var(--m2));opacity:.35;transition:width 1s}
.gen-bar span{position:relative;display:block;text-align:center;font-size:12.5px;line-height:28px;font-weight:600}
.gen-log,.clog{display:flex;flex-direction:column;gap:12px;flex:1;padding:6px 0 12px}
.b{display:flex} .b.me{justify-content:flex-end}
.bt{max-width:86%;padding:12px 15px;border-radius:20px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:16px;line-height:1.5}
.b.ai .bt{background:var(--card2);border:1px solid var(--line);border-top-left-radius:6px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.b.me .bt{background:linear-gradient(120deg,var(--m1),var(--m2));color:var(--ink-on-m);border-top-right-radius:6px;font-weight:500}
.dots{display:inline-flex;gap:5px;padding:4px 2px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--dim);animation:bob 1.2s infinite}
.dots i:nth-child(2){animation-delay:.15s} .dots i:nth-child(3){animation-delay:.3s}
@keyframes bob{0%,80%,100%{transform:translateY(0);opacity:.4}40%{transform:translateY(-5px);opacity:1}}
.gen-dock{position:sticky;bottom:0;padding:10px 0 calc(env(safe-area-inset-bottom,0px) + 12px);background:linear-gradient(transparent,var(--bg) 30%);display:grid;gap:8px}
body:not(.genesis-mode) .gen-dock{bottom:calc(env(safe-area-inset-bottom,0px) + 84px);padding-bottom:6px}
.composer{display:flex;align-items:flex-end;gap:8px;background:var(--card2);border:1px solid var(--line2);border-radius:22px;padding:6px 6px 6px 14px;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
.gen-in{flex:1;border:0;background:transparent;resize:none;outline:none;font-size:16px;line-height:1.45;padding:9px 0;max-height:220px;min-width:0}
.send{width:44px;height:44px;border-radius:16px;border:0;background:linear-gradient(120deg,var(--m1),var(--m2));color:var(--ink-on-m);display:grid;place-items:center;cursor:pointer;flex:none}
.send.stop{background:var(--card);color:var(--text);border:1px solid var(--line2)}
.send:disabled{opacity:.5}
.gen-note{font-size:13.5px;color:var(--warn);min-height:0}
.gen-note:empty{display:none}

/* building */
.build{min-height:100vh;display:grid;justify-items:center;align-content:center;gap:18px;padding:40px 0;max-width:520px;margin:0 auto;text-align:center}
.build-h{font-size:clamp(26px,6.5vw,36px);line-height:1.1}
.build-steps{list-style:none;margin:6px 0;padding:0;display:grid;gap:10px;width:100%;text-align:left}
.bs{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;padding:14px;border-radius:18px;background:var(--card);border:1px solid var(--line)}
.bs i{width:22px;height:22px;border-radius:50%;border:2px solid var(--line2)}
.bs.run i{border-color:var(--m1);border-right-color:transparent;animation:spin 1s linear infinite}
.bs.ok i{background:linear-gradient(120deg,var(--m1),var(--m2));border:0}
.bs.err i{border-color:var(--bad)}
.bs small{display:block;color:var(--dim);font-size:13px}
.bs.wait{opacity:.55}

/* today */
.hero{display:flex;align-items:center;gap:14px;padding:18px;border-radius:26px;background:linear-gradient(135deg,color-mix(in srgb,var(--m1) 22%,transparent),color-mix(in srgb,var(--m2) 14%,transparent));border:1px solid var(--line2)}
.hero-l{flex:1;min-width:0;display:grid;gap:8px}
.hero-h{font-size:clamp(24px,6.4vw,34px);line-height:1.08;overflow-wrap:anywhere}
.hero-s{color:var(--dim);font-size:14.5px}
.banner{border-radius:22px;padding:16px;display:grid;gap:8px;border:1px solid color-mix(in srgb,var(--m1) 50%,transparent);background:color-mix(in srgb,var(--m1) 12%,var(--card))}
.banner h3{font-size:20px}
.banner.warn{border-color:color-mix(in srgb,var(--warn) 55%,transparent);background:color-mix(in srgb,var(--warn) 10%,var(--card))}
.brief-h{font-size:21px;line-height:1.25}
.brief-p{font-size:15.5px}
.brief-f{margin:0;padding-left:20px;display:grid;gap:4px}
.brief-f li::marker{color:var(--m1);font-weight:700}
.challenge{display:grid;gap:2px;padding:10px 12px;border-radius:14px;background:color-mix(in srgb,var(--m2) 14%,transparent)}
.challenge small{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);font-weight:600}
.warn-t{color:var(--warn);font-size:14.5px}
.moods{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.md{display:flex;align-items:center;gap:8px;border:1px solid var(--line2);background:var(--card);border-radius:14px;padding:10px;cursor:pointer;text-align:left;font-size:14px}
.md i{width:22px;height:22px;border-radius:50%;flex:none}
.md[data-m="joyful"] i{background:linear-gradient(135deg,#FF78B4,#FFC24B)} .md[data-m="energized"] i{background:linear-gradient(135deg,#FFB347,#FF6F61)} .md[data-m="focused"] i{background:linear-gradient(135deg,#7B6CFF,#39A9F2)} .md[data-m="calm"] i{background:linear-gradient(135deg,#5CC8C0,#6E8BFF)} .md[data-m="low"] i{background:linear-gradient(135deg,#9DA9DA,#C4B3E6)} .md[data-m="stressed"] i{background:linear-gradient(135deg,#78C9A4,#C5E3A0)}
.md[aria-pressed="true"]{border-color:var(--m1);background:color-mix(in srgb,var(--m1) 18%,var(--card));font-weight:700}
.moods.big .md{padding:14px 12px;font-size:15px}
.ci-done{display:flex;align-items:center;gap:12px} .ci-done div{flex:1;display:grid} .ci-done small{color:var(--dim)}
.list{display:grid;gap:6px}
.crow{display:flex;gap:12px;align-items:flex-start;padding:10px 12px;border-radius:14px;background:var(--card2);border:1px solid var(--line);border-left:3px solid var(--area,var(--m1));cursor:pointer}
.crow input{width:22px;height:22px;margin:1px 0 0;accent-color:var(--m1);flex:none}
.ct{display:grid} .ct small{color:var(--dim);font-size:12.5px}
.crow.on b{text-decoration:line-through;color:var(--dim)}
.habit-strip{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.hb{flex:none;width:118px;display:grid;gap:6px;justify-items:start;padding:12px;border-radius:18px;border:1px solid var(--line);background:var(--card);cursor:pointer;text-align:left}
.hb i{width:28px;height:28px;border-radius:50%;border:2px solid var(--area);display:grid;place-items:center;font-style:normal;font-weight:800;color:var(--ink-on-m)}
.hb[aria-pressed="true"] i{background:var(--area)}
.hb span{font-size:13.5px;font-weight:600;line-height:1.25}
.hb small{color:var(--dim);font-size:12px}
.surprise{background:linear-gradient(140deg,color-mix(in srgb,var(--m3) 22%,var(--card)),var(--card))}
.surprise h3{font-size:20px}

/* timeline */
.tl{display:grid;gap:8px}
.tlr{display:grid;grid-template-columns:50px 1fr auto auto;gap:10px;align-items:center}
.tlt{display:grid;text-align:right;font-variant-numeric:tabular-nums}
.tlt b{font-size:14px} .tlt small{font-size:11.5px;color:var(--dim)}
.tlb{padding:11px 13px;border-radius:16px;background:var(--card);border:1px solid var(--line);border-left:4px solid var(--area);min-width:0}
.tlx{font-weight:600;font-size:15px;line-height:1.35;overflow-wrap:anywhere}
.tlm{font-size:12px;color:var(--dim);margin-top:2px}
.star{color:var(--warn);margin-right:4px}
.tlr.cur .tlb{background:color-mix(in srgb,var(--area) 18%,var(--card2));border-color:var(--area);box-shadow:0 0 0 1px var(--area),0 10px 30px -12px var(--area)}
.tlr.cur .tlt b{color:var(--m1)}
.tlr.done .tlx{text-decoration:line-through;color:var(--dim)}
.tlr.fixed .tlb{background:transparent;border-style:dashed;border-left-style:solid}
.tlr.late{opacity:.62}
.tick{width:34px;height:34px;border-radius:50%;border:2px solid var(--line2);background:transparent;display:grid;place-items:center;cursor:pointer;color:var(--ink-on-m)}
.tick[aria-pressed="true"]{background:linear-gradient(120deg,var(--m1),var(--m2));border-color:transparent}
.tick.big{width:44px;height:44px}
.x{background:none;border:0;color:var(--dim);cursor:pointer;padding:6px;border-radius:8px;display:grid;place-items:center;min-width:28px;min-height:28px}
.nowline{position:relative;height:18px;margin-left:60px}
.nowline::before{content:"";position:absolute;left:0;right:0;top:50%;height:2px;background:linear-gradient(90deg,var(--m2),transparent)}
.nowline span{position:absolute;left:-60px;top:0;width:50px;text-align:right;font-size:11.5px;font-weight:700;color:var(--m2)}

/* plan */
.mnav{display:flex;align-items:center;gap:10px}
.mnav-h{flex:1;text-align:center;font-size:24px;text-transform:capitalize}
.weeks{display:grid;gap:8px}
.wk{padding:10px 12px;border-radius:14px;background:var(--card2);border:1px solid var(--line);display:grid;gap:2px}
.wk small{color:var(--dim);font-size:12px} .wk b{font-size:15px} .wk ul{margin:4px 0 0;padding-left:18px;color:var(--dim);font-size:14px}
.rules{margin:0;padding:0;list-style:none;display:grid;gap:6px}
.rules li{padding-left:20px;position:relative;font-size:14.5px}
.rules li::before{content:"";position:absolute;left:3px;top:.55em;width:8px;height:8px;border-radius:50%;background:linear-gradient(120deg,var(--m1),var(--m2))}
.cal-card{padding:12px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal-h{text-align:center;font-size:11px;color:var(--dim);padding-bottom:2px;text-transform:capitalize}
.cd{position:relative;aspect-ratio:1/1.1;border-radius:12px;border:1px solid var(--line);background:color-mix(in srgb,var(--m1) calc(var(--load)*38%),var(--card));display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;padding:5px;cursor:pointer;min-width:0;overflow:hidden}
.cd b{font-size:13px;font-variant-numeric:tabular-nums}
.cd small{font-size:9.5px;color:var(--dim);position:absolute;right:4px;top:5px}
.cdots{display:flex;gap:2px;flex-wrap:wrap}
.cdots i{width:5px;height:5px;border-radius:50%;background:var(--area)}
.cd.today{border-color:var(--text)} .cd.sel{box-shadow:0 0 0 2px var(--m1);border-color:transparent} .cd.past{opacity:.6}
.qa{gap:8px}

/* coach */
.coach{max-width:680px;margin:0 auto;display:flex;flex-direction:column;min-height:calc(100vh - 170px)}
.coach-top{display:grid;justify-items:center;gap:8px;padding:6px 0 4px}
.quick{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.quick .chip{flex:none;font-size:13.5px}

/* growth */
.score{grid-template-columns:auto 1fr;align-items:center;gap:16px}
.minis{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mini{padding:10px;border-radius:14px;background:var(--card2);border:1px solid var(--line);display:grid}
.mini small{color:var(--dim);font-size:12px} .mini b{font-family:var(--f-display);font-size:20px;font-variant-numeric:tabular-nums}
.letter{background:linear-gradient(160deg,color-mix(in srgb,var(--m2) 16%,var(--card)),var(--card))}
.letter-t{white-space:pre-wrap;font-size:16px;line-height:1.65}
.prog-h{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.prog-h small{color:var(--dim);font-size:12.5px} .prog-h h3{font-size:19px} .prog-h .pct{font-size:22px}
.phase{display:grid;gap:2px;padding:10px 12px;border-radius:14px;background:color-mix(in srgb,var(--area) 12%,transparent)}
.phase small{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);font-weight:600}
.phase span{font-size:14px;color:var(--dim)}
details.fold summary{cursor:pointer;font-weight:600;list-style:none;display:flex;justify-content:space-between;gap:8px}
details.fold summary::-webkit-details-marker{display:none}
details.fold summary::after{content:"+";color:var(--m1);font-weight:700}
details.fold[open] summary::after{content:"–"}
details.fold ul{margin:8px 0 0;padding-left:18px;display:grid;gap:4px}
.habit{display:grid;grid-template-columns:1fr auto auto;gap:12px;align-items:center;padding:12px 14px;border-radius:18px;background:var(--card);border:1px solid var(--line);border-left:4px solid var(--area)}
.hbx{display:grid;gap:3px;min-width:0} .hbx small{color:var(--dim);font-size:12.5px}
.hdots{display:flex;gap:3px;margin-top:3px}
.hdots i{width:10px;height:10px;border-radius:3px;background:var(--line2)} .hdots i.on{background:var(--area)}
.hstreak{display:grid;justify-items:center} .hstreak b{font-family:var(--f-display);font-size:22px;line-height:1} .hstreak small{color:var(--dim);font-size:11px}
.goal-h{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.chart{padding:12px} .chart-svg{width:100%;height:auto;display:block}
.chart-svg text{font-family:var(--f-body)}
.heat{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.heat small{text-align:center;font-size:11px;color:var(--dim);text-transform:capitalize}
.heat i{aspect-ratio:1;border-radius:7px;background:color-mix(in srgb,var(--m1) calc(var(--v,0)*100%),var(--card2));border:1px solid var(--line)}
.heat i.t{outline:2px solid var(--text);outline-offset:1px}

/* you */
.portrait{display:grid;justify-items:center;text-align:center;gap:10px;padding:26px 16px;border-radius:28px;background:radial-gradient(120% 80% at 50% 0%,color-mix(in srgb,var(--m1) 26%,transparent),transparent),var(--card);border:1px solid var(--line2)}
.p-arch{font-size:clamp(30px,8vw,46px);line-height:1.02}
.p-truth{font-family:var(--f-display);font-size:19px;line-height:1.35;max-width:32ch}
.p-sum{color:var(--dim);max-width:60ch;font-size:15px}
.traits{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.trait ul{margin:0;padding-left:18px;display:grid;gap:4px;font-size:14.5px}
.trait p{font-size:14.5px}
.trait.strengths{border-color:color-mix(in srgb,var(--good) 40%,transparent)} .trait.shadows{border-color:color-mix(in srgb,var(--bad) 40%,transparent)}
.vision .lead{font-family:var(--f-display);font-size:20px}
.pillars{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.pillar{padding:10px 12px;border-radius:14px;background:var(--card2);border:1px solid var(--line);display:grid;gap:2px} .pillar small{color:var(--dim);font-size:13px}
.pages{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pcard{position:relative;overflow:hidden;text-align:left;display:grid;gap:6px;align-content:end;min-height:150px;padding:14px;border-radius:22px;border:1px solid var(--line);background:var(--card);cursor:pointer}
.pglow{position:absolute;inset:-30% -30% auto auto;width:140%;height:120%;border-radius:50%;opacity:.55;filter:blur(24px);pointer-events:none}
.pcard[data-m="joyful"] .pglow{background:radial-gradient(circle,#FF78B4,transparent 60%)} .pcard[data-m="energized"] .pglow{background:radial-gradient(circle,#FFB347,transparent 60%)} .pcard[data-m="focused"] .pglow{background:radial-gradient(circle,#7B6CFF,transparent 60%)} .pcard[data-m="calm"] .pglow{background:radial-gradient(circle,#5CC8C0,transparent 60%)} .pcard[data-m="low"] .pglow{background:radial-gradient(circle,#9DA9DA,transparent 60%)} .pcard[data-m="stressed"] .pglow{background:radial-gradient(circle,#78C9A4,transparent 60%)}
.pcard b{position:relative;font-family:var(--f-display);font-size:17px;line-height:1.2}
.pcard small{position:relative;color:var(--dim);font-size:12.5px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.pcard .new{position:absolute;top:10px;left:12px;font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:2px 8px;border-radius:99px;background:linear-gradient(120deg,var(--m1),var(--m2));color:var(--ink-on-m)}
.facts{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:4px}
.facts li{display:flex;gap:6px;align-items:flex-start;justify-content:space-between;font-size:14.5px;padding:6px 0;border-top:1px solid var(--line)}
.fold.card summary small{color:var(--dim);margin-left:auto}
details.fold.card summary{justify-content:flex-start;align-items:center}
.rt{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.rt b{font-variant-numeric:tabular-nums;font-size:14px;color:var(--area)} .rt span{display:grid;font-size:14.5px} .rt small{color:var(--dim);font-size:12px;text-transform:capitalize}

/* AI page */
.page{display:grid;gap:18px;max-width:640px;margin:0 auto}
.page .back{margin-bottom:-6px}
.page-h{font-size:clamp(30px,8vw,44px);line-height:1.05}
.psec{display:grid;gap:10px;padding:16px;border-radius:22px;background:var(--card);border:1px solid var(--line)}
.psec h2{font-size:20px}
.psec ul{margin:0;padding-left:20px;display:grid;gap:6px}
.psec.quote{background:linear-gradient(140deg,color-mix(in srgb,var(--m1) 20%,var(--card)),var(--card))}
blockquote{margin:0;font-family:var(--f-display);font-size:22px;line-height:1.35}
ol.steps{margin:0;padding:0;list-style:none;counter-reset:st;display:grid;gap:10px}
ol.steps li{counter-increment:st;display:grid;grid-template-columns:32px 1fr;gap:10px;align-items:start}
ol.steps li::before{content:counter(st);width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:13px;background:linear-gradient(120deg,var(--m1),var(--m2));color:var(--ink-on-m)}
.pstats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.pstats div{padding:10px 12px;border-radius:14px;background:var(--card2);display:grid}
.pstats small{color:var(--dim);font-size:12.5px} .pstats b{font-family:var(--f-display);font-size:19px}

/* tabs */
#tabs{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 12px);z-index:20;display:grid;grid-template-columns:repeat(5,1fr);align-items:end;width:min(460px,calc(100% - 24px));padding:6px;border-radius:26px;background:color-mix(in srgb,var(--bg2) 72%,transparent);border:1px solid var(--line2);backdrop-filter:blur(22px) saturate(1.3);-webkit-backdrop-filter:blur(22px) saturate(1.3);box-shadow:var(--shadow)}
.tab{display:grid;justify-items:center;gap:2px;border:0;background:none;color:var(--dim);font-size:11px;font-weight:600;padding:8px 2px 6px;border-radius:18px;cursor:pointer}
.tab[aria-current="page"]{color:var(--text);background:var(--card2)}
.tab-orb .orb{width:40px;height:40px;margin-top:-18px;box-shadow:0 8px 24px -8px var(--m1);border-radius:50%}

/* sheet + toast */
#sheet{position:fixed;inset:0;z-index:40;display:grid;align-items:end}
.sheet-bg{position:absolute;inset:0;background:rgba(5,7,14,.55);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);animation:fade .25s}
.sheet-p{position:relative;max-height:88vh;overflow-y:auto;background:var(--bg2);border-radius:28px 28px 0 0;border:1px solid var(--line2);border-bottom:0;padding:18px 16px calc(env(safe-area-inset-bottom,0px) + 22px);width:100%;max-width:640px;margin:0 auto;animation:up .3s cubic-bezier(.2,.9,.3,1)}
.sheet-h{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.sheet-h h2{font-size:22px}
.sheet-b{display:grid;gap:10px}
body.sheet-open{overflow:hidden}
.rit-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.rit-stats div{padding:10px;border-radius:14px;background:var(--card2);border:1px solid var(--line);display:grid}
.rit-stats small{color:var(--dim);font-size:12px} .rit-stats b{font-family:var(--f-display);font-size:20px}
.focus-ring{display:grid;place-items:center;padding:10px 0}
.focus-ring .ring-c b{font-size:48px}
#toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 12px);z-index:60;width:min(520px,calc(100% - 32px));padding:12px 16px;border-radius:18px;background:var(--bg2);border:1px solid var(--line2);box-shadow:var(--shadow);display:grid;gap:2px;animation:drop .35s cubic-bezier(.2,.9,.3,1)}
#toast b{font-weight:700} #toast span{color:var(--dim);font-size:14px}
@keyframes up{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
@keyframes drop{from{transform:translate(-50%,-12px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
@keyframes fade{from{opacity:0}}
main > *{animation:up .4s cubic-bezier(.2,.9,.3,1) both}

@media (max-width:420px){ .traits,.pages{grid-template-columns:1fr} .moods{grid-template-columns:repeat(2,1fr)} .gen-map{grid-template-columns:repeat(5,1fr)} .hero{flex-direction:column;align-items:stretch} .hero .ring{align-self:center} .score{grid-template-columns:1fr;justify-items:center} .minis{width:100%} .tlr{grid-template-columns:44px 1fr auto auto;gap:8px} .nowline{margin-left:52px} .nowline span{left:-52px;width:44px} }
@media (prefers-reduced-motion:reduce){ *,*::before,*::after{animation:none!important;transition:none!important} }
</style>
